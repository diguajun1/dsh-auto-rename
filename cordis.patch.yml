# dsh-auto-rename bundle patch: mount the plugin as one row.
# The command is registered against the global ctx.commands surface, which
# the dsh web UI command plane discovers; the model-facing rename tool is
# registered at load time on ctx.tools, and the idle auto-renamer listens to
# `session/event` on the same plugin context.
#
# Idle auto mode config:
#   enabled     - false turns the automatic naming turn off; /auto-rename still works.
#   idleMs      - quiet window after a human-driven turn before the naming turn
#                 is enqueued. 300000 ms = 5 minutes (the shipped default).
#   idleMinutes - the same window in minutes; ignored when idleMs is set.
- insert:
    - id: dsh-auto-rename
      name: dsh-auto-rename
      inject: [commands]
      config:
        enabled: true
        idleMs: 300000
